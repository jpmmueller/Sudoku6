<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudoku Helper</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <!-- p5 lokal -->
    <script src="libraries/p5.min.js"></script>
    <!-- p5.sound optional -->
    <!-- <script src="libraries/p5.sound.min.js"></script> -->
  </head>

  <body>
    <div id="controls" class="controls">
      <div class="toggle-group">
        <label class="toggle">
          <input type="checkbox"
                 id="toggleCandidates"
                 checked
                 onchange="onToggleCandidates(this)">
          <span class="toggle-label">Kandidaten anzeigen (K)</span>
        </label>
        <label class="toggle">
          <input type="checkbox"
                 id="toggleEditMode"
                 onchange="onToggleEditMode(this)">
          <span class="toggle-label">Editmodus (E)</span>
        </label>
      </div>
      <div class="button-group">
        <button class="btn primary" onclick="checkSolvable()">Prüfen</button>
        <button class="btn" onclick="solveCurrentBoard()">Lösen</button>
      </div>
    </div>

    <!-- Reihenfolge wichtig: erst Logik, dann UI, dann sketch -->
    <script src="sudoku-logic.js"></script>
    <script src="sudoku-ui.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
